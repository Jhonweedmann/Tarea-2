openapi: 3.0.3
info:
  title: Servicio de Inscripción
  version: 2.0.0
  description: >-
    Servicio interno de AprendeMás con los estudiantes y sus inscripciones. No se
    expone directamente: el gateway publica /api/v1/estudiantes y autentica antes de
    reenviar, por eso este servicio no valida tokens. Todos los errores usan
    Problem Details (RFC 9457) con Content-Type application/problem+json.
servers:
  - url: http://inscripcion:8000
tags:
  - name: estudiantes
  - name: operacion

paths:
  /health:
    get:
      tags: [operacion]
      summary: Indica si el servicio está operativo
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Salud'}

  /estudiantes:
    get:
      tags: [estudiantes]
      summary: Lista estudiantes, paginado
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Página de estudiantes ordenada por nombre
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PaginaEstudiantes'}
        '422': {$ref: '#/components/responses/Invalida'}
    post:
      tags: [estudiantes]
      summary: Crea un estudiante
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EstudianteEntrada'}
      responses:
        '201':
          description: Estudiante creado
          headers:
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Estudiante'}
        '409': {$ref: '#/components/responses/Conflicto'}
        '422': {$ref: '#/components/responses/Invalida'}

  /estudiantes/{estudiante_id}:
    parameters:
      - {name: estudiante_id, in: path, required: true, schema: {type: string}}
    get:
      tags: [estudiantes]
      summary: Consulta un estudiante
      responses:
        '200':
          description: Estudiante encontrado
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Estudiante'}
        '404': {$ref: '#/components/responses/NoEncontrado'}

components:
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Máximo de elementos por página
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Offset:
      name: offset
      in: query
      required: false
      description: Cantidad de elementos a saltar
      schema: {type: integer, minimum: 0, default: 0}

  headers:
    Location:
      description: Ruta interna del recurso creado (el gateway la traduce a la ruta pública)
      schema: {type: string}

  responses:
    NoEncontrado:
      description: El recurso no existe
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    Conflicto:
      description: El estado actual impide la operación (por ejemplo, correo repetido)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}
    Invalida:
      description: El cuerpo o los parámetros no cumplen el contrato
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problema'}

  schemas:
    Salud:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, enum: [ok]}

    EstudianteEntrada:
      type: object
      required: [nombre, email]
      properties:
        nombre: {type: string, minLength: 2, maxLength: 120}
        email: {type: string, format: email}

    Estudiante:
      type: object
      additionalProperties: false
      required: [id, nombre, email]
      properties:
        id: {type: string}
        nombre: {type: string}
        email: {type: string, format: email}

    PaginaEstudiantes:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Estudiante'}
        total: {type: integer, minimum: 0}
        limit: {type: integer}
        offset: {type: integer}

    Problema:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [loc, message]
            properties:
              loc: {type: array}
              message: {type: string}
