# Forma K — Unidad 3. Arquitectura en docs/PLAN.md §1, contratos en docs/contratos/.
#
# Solo el gateway publica un puerto (8080). Grafana publica el 3000 solo para la demo.
# orquestador e inscripcion son los servicios reales de B; pagos corre hoy con el stub (stubs/)
# hasta que C reemplace su bloque por la imagen real (ver docs/TRASPASO.md).

x-healthcheck-http: &healthcheck-http
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  # ---------------------------------------------------------------- Persona A: exposición
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      ORQUESTADOR_URL: http://orquestador:8000
      INSCRIPCION_URL: http://inscripcion:8000
      BFF_URL: http://bff-web:8000
      GATEWAY_TIMEOUT_SECONDS: "5"
      # Debe superar el peor caso de la Saga (timeouts y reintentos del orquestador hacia Pagos).
      GATEWAY_TIMEOUT_SAGA_SECONDS: "15"
      RATE_LIMIT_VENTANA_SECONDS: "10"
      METRICAS_PUERTO: "9100"
    ports:
      - "8080:8080"
    healthcheck:
      <<: *healthcheck-http
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
    depends_on:
      redis:
        condition: service_healthy
      # Los servicios internos no son requisito para arrancar: si no están, el gateway responde 502.
      bff-web:
        condition: service_started
      orquestador:
        condition: service_started
      inscripcion:
        condition: service_started

  bff-web:
    build:
      context: .
      dockerfile: bff-web/Dockerfile
    environment:
      INSCRIPCION_URL: http://inscripcion:8000
      PAGOS_URL: http://pagos:8000
      CUPOS_GRPC_TARGET: cupos:50051
      BFF_TIMEOUT_SECONDS: "2"
    healthcheck: *healthcheck-http
    depends_on:
      - cupos

  # ---------------------------------------------------------------- Persona B: Saga
  orquestador:
    build:
      context: .
      dockerfile: orquestador/Dockerfile
    environment:
      ORQUESTADOR_DB: /data/orquestador.db
      CUPOS_GRPC_TARGET: cupos:50051
      INSCRIPCION_URL: http://inscripcion:8000
      PAGOS_URL: http://pagos:8000
      # Base 1: la 0 la usa el rate limit del gateway.
      REDIS_URL: redis://redis:6379/1
      MATRICULA_MONTO: "150000"
      # Timeout de cada llamada de la Saga (peor caso ~14 s, bajo los 15 s del gateway).
      CUPOS_TIMEOUT_SECONDS: "2"
      INSCRIPCION_TIMEOUT_SECONDS: "2"
      PAGOS_TIMEOUT_SECONDS: ${PAGOS_TIMEOUT_SECONDS:-2}
      RESILIENCIA: ${RESILIENCIA:-on}
      PAGOS_CONNECT_TIMEOUT_SECONDS: "1"
      PAGOS_REINTENTOS: "1"
      PAGOS_BACKOFF_BASE_SECONDS: "0.2"
      PAGOS_BULKHEAD_MAX: ${PAGOS_BULKHEAD_MAX:-5}
      PAGOS_CB_UMBRAL: "0.5"
      PAGOS_CB_MIN_LLAMADAS: "5"
      PAGOS_CB_VENTANA_SECONDS: "10"
      PAGOS_CB_ESPERA_SECONDS: "5"
      PAGOS_CB_EXITOS_CIERRE: "2"
    volumes:
      - orquestador_data:/data
    healthcheck: *healthcheck-http
    depends_on:
      redis:
        condition: service_healthy
      # Cupos, Inscripción y Pagos no son requisito para arrancar: si faltan, la Saga falla y compensa.
      cupos:
        condition: service_started
      inscripcion:
        condition: service_started
      pagos:
        condition: service_started

  inscripcion:
    build:
      context: .
      dockerfile: inscripcion/Dockerfile
    environment:
      INSCRIPCION_DB: /data/inscripcion.db
    volumes:
      - inscripcion_data:/data
    healthcheck: *healthcheck-http

  cupos:
    build:
      context: .
      dockerfile: cupos/Dockerfile
    environment:
      CUPOS_DB: /data/cupos.db
    volumes:
      - cupos_data:/data
    healthcheck:
      <<: *healthcheck-http
      test: ["CMD", "python", "-c", "import grpc; grpc.channel_ready_future(grpc.insecure_channel('localhost:50051')).result(timeout=2)"]

  # ---------------------------------------------------------------- Persona C: Pagos
  pagos:
    build:
      context: .
      dockerfile: pagos/Dockerfile
    environment:
      PAGOS_DB: /data/pagos.db
    volumes:
      - pagos_data:/data
    healthcheck: *healthcheck-http

  # ---------------------------------------------------------------- Plataforma
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.16.0
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    # Sin "ports": Grafana lo consulta por la red interna. Para depurar: docker compose port / agregar "9090:9090".

  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: forma-k
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/forma-k.json
    volumes:
      - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidad/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ---------------------------------------------------------------- Tarea 1 (demo)
  cupos-node-client:
    build:
      context: .
      dockerfile: clients/node-grpc-client/Dockerfile
    profiles: ["demo"]
    depends_on:
      - cupos

volumes:
  cupos_data:
  inscripcion_data:
  orquestador_data:
